<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>项目首页</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    background: linear-gradient(135deg, #667eea, #764ba2);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
  }
  .wy_container {
    max-width: 720px;
    width: 100%;
    text-align: center;
    color: #fff;
  }
  .wy_title {
    font-size: 2.2rem;
    margin-bottom: 0.5rem;
  }
  .wy_subtitle {
    font-size: 1rem;
    opacity: 0.85;
    margin-bottom: 2.5rem;
  }
  .wy_links {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 1.25rem;
  }
  .wy_card {
    background: rgba(255, 255, 255, 0.12);
    backdrop-filter: blur(8px);
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 12px;
    padding: 1.75rem 1.25rem;
    text-decoration: none;
    color: #fff;
    transition: transform 0.2s, background 0.2s;
  }
  .wy_card:hover {
    transform: translateY(-4px);
    background: rgba(255, 255, 255, 0.2);
  }
  .wy_card h2 {
    font-size: 1.3rem;
    margin-bottom: 0.5rem;
  }
  .wy_card p {
    font-size: 0.88rem;
    opacity: 0.85;
  }
  .wy_footer {
    margin-top: 2.5rem;
    font-size: 0.8rem;
    opacity: 0.7;
  }
</style>
</head>
<body>
  <main class="wy_container">
    <h1 class="wy_title">项目首页</h1>
    <p class="wy_subtitle">王垚的前端练习项目</p>
    <div class="wy_links">
      <a href="news-tabs.html" class="wy_card">
        <h2>新闻选项卡</h2>
        <p>可复用 Tab 组件 · 国内 / 省内 / 国际 / 最热</p>
      </a>
      <a href="click-ranking.html" class="wy_card">
        <h2>点击排行</h2>
        <p>点击排行面板 · 实时 / 24小时排行</p>
      </a>
    </div>
    <footer class="wy_footer">资源均本地化存放</footer>
  </main>
</body>
</html>
